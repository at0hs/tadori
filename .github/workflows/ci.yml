name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # テスト用の DB（D-22）。compose.dev.yaml の db-test と同じ接続先にする。
    services:
      db-test:
        image: postgres:18
        env:
          POSTGRES_USER: tadori
          POSTGRES_PASSWORD: tadori-test
          POSTGRES_DB: tadori_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U tadori -d tadori_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm biome ci .
      - run: pnpm test
      - run: pnpm build
      - name: ライセンスの一覧ができ、Tadori 自身を含まない（D-69）
        run: grep -qx 'react (MIT)' web/dist/THIRD_PARTY_LICENSES.txt && ! grep -q '@tadori/' web/dist/THIRD_PARTY_LICENSES.txt
      # E2E（ui.md 7章）。API はテスト用 DB を空にして起動するので、pnpm test の後に流す。
      - run: pnpm --filter @tadori/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # 本番の構成（compose.yaml）を起動し、バックアップと復元の確認まで流す（operations.md）
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ダミーの .env を書く
        run: |
          cat > .env <<'ENV'
          APP_URL=http://localhost:3000
          POSTGRES_PASSWORD=ci0123456789abcdef
          BETTER_AUTH_SECRET=ci-secret-ci-secret-ci-secret-0123456789
          INITIAL_ADMIN_USERNAME=admin
          INITIAL_ADMIN_NAME=管理者
          INITIAL_ADMIN_EMAIL=admin@example.test
          INITIAL_ADMIN_PASSWORD=Ci-initial-passw0rd
          ENV
      - run: docker compose up -d --build --wait
      - run: curl -fsS http://localhost:3000/api/health
      # 版の表示（D-69）。イメージの SHA はビルドの中で .git から読む
      - name: イメージの SHA がこのコミットと一致する
        run: test "$(docker compose exec -T app cat /app/COMMIT)" = "$(git rev-parse --short=7 HEAD)"
      - name: .git のないソースからもビルドでき、SHA は unknown になる
        run: |
          git archive --format=tar HEAD | docker build --target commit -t tadori-commit-nogit -
          test "$(docker run --rm --entrypoint cat tadori-commit-nogit /COMMIT)" = unknown
      - name: 画面の URL を直接開くと index.html が返る
        run: curl -fsS http://localhost:3000/executions/x | grep -q 'id="root"'
      - name: バックアップのスクリプトのテスト
        run: docker compose run --rm -T backup bash /opt/tadori/test/lib.test.sh
      - name: その場でバックアップを取る
        run: |
          docker compose exec -T backup tadori-backup | tee backup.txt
          sed -n 's/.*バックアップを取った：\/backups\///p' backup.txt > dump-path.txt
          test -s dump-path.txt
      - name: 復元の確認（初期管理者の1人が戻る）
        run: docker compose run --rm -T backup tadori-verify | tee verify.txt && grep -qx 'ユーザー：1' verify.txt
      # バックアップの後の変更が復元で消えることを、目印のテーブルで確かめる（operations.md 6.1）
      - name: 目印のテーブルを作る
        run: docker compose exec -T db psql -U tadori -d tadori -v ON_ERROR_STOP=1 -c 'CREATE TABLE ci_marker ()'
      # 待ち受け中の app は接続を閉じているので、わざと接続を開いておく
      - name: DB に接続がある間は復元を断る
        run: |
          docker compose exec -d db psql -U tadori -d tadori -c 'SELECT pg_sleep(20)'
          sleep 2
          if docker compose exec -T backup tadori-restore "$(cat dump-path.txt)" --yes; then
            echo "断られなかった"; exit 1
          fi
          test "$(docker compose exec -T db psql -U tadori -d tadori -At -c "SELECT to_regclass('ci_marker') IS NOT NULL")" = t
          docker compose exec -T db psql -U tadori -d postgres -c \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE query = 'SELECT pg_sleep(20)'"
      - name: 復元する
        run: |
          docker compose stop app
          docker compose exec -T backup tadori-restore "$(cat dump-path.txt)" --yes
          docker compose start app
      - name: 目印のテーブルが消えている
        run: |
          test "$(docker compose exec -T db psql -U tadori -d tadori -At -c "SELECT to_regclass('ci_marker') IS NULL")" = t
      - name: 復元した後も app が動く
        run: docker compose up -d --wait && curl -fsS http://localhost:3000/api/health
      - if: failure()
        run: docker compose logs

  # HTTPS の前段（Caddy、compose.https.yaml）を起動し、証明書の2通りと転送のヘッダの扱いを確かめる（operations.md 9章、D-68）
  compose-https:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ダミーの .env を書く
        run: |
          cat > .env <<'ENV'
          APP_URL=https://localhost
          POSTGRES_PASSWORD=ci0123456789abcdef
          BETTER_AUTH_SECRET=ci-secret-ci-secret-ci-secret-0123456789
          INITIAL_ADMIN_USERNAME=admin
          INITIAL_ADMIN_NAME=管理者
          INITIAL_ADMIN_EMAIL=admin@example.test
          INITIAL_ADMIN_PASSWORD=Ci-initial-passw0rd
          CADDY_TLS=internal
          COMPOSE_PATH_SEPARATOR=:
          COMPOSE_FILE=compose.yaml:compose.https.yaml
          ENV
          # 先に作る。無いまま起動すると、bind mount のために dockerd が root の持ち物で作り、後で書けなくなる
          mkdir -p certs
      - run: docker compose up -d --build --wait
      - name: internal のルート証明書で HTTPS が通る
        run: |
          docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt root.crt
          curl --cacert root.crt -fsS https://localhost/api/health
      - name: HTTP に来たら HTTPS に移す
        run: curl -sI http://localhost/ | grep -q '^HTTP/1.1 308'
      # 利用者が付けた X-Forwarded-For は Caddy が捨てる。操作ログの IP は偽の値にも Caddy の IP にもならない
      - name: 偽の X-Forwarded-For を信じない
        run: |
          code=$(curl --cacert root.crt -s -o /dev/null -w '%{http_code}' -X POST https://localhost/api/auth/sign-in/username \
            -H 'Origin: https://localhost' -H 'Content-Type: application/json' -H 'X-Forwarded-For: 203.0.113.99' \
            -d '{"username":"admin","password":"wrong-password"}')
          test "$code" = 401
          # ログがコンテナのログに書かれるまで少し待つことがある
          for i in 1 2 3 4 5; do
            docker compose logs app | grep '"event":"auth.login_failed"' | tail -1 > login.txt || true
            test -s login.txt && break
            sleep 1
          done
          cat login.txt
          grep -q '"ip":"' login.txt
          if grep -q -e '203.0.113.99' -e '"ip":"10.203.53.2"' -e '"ip":"::ffff:10.203.53.2"' login.txt; then
            echo "IP が偽の値か Caddy の IP になっている"; exit 1
          fi
      - name: 持ち込みの証明書（自前の認証局で発行）で HTTPS が通る
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 2 -subj '/CN=Tadori CI CA' \
            -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign'
          openssl req -newkey rsa:2048 -nodes -keyout certs/tadori.key -out server.csr -subj '/CN=localhost'
          printf 'subjectAltName=DNS:localhost\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 2 -extfile server.ext
          cat server.crt ca.crt > certs/tadori.crt
          sed -i 's|^CADDY_TLS=.*|CADDY_TLS=/certs/tadori.crt /certs/tadori.key|' .env
          docker compose up -d --wait
          curl --cacert ca.crt -fsS https://localhost/api/health
      - if: failure()
        run: docker compose logs
