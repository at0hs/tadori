name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # テスト用の DB（D-22）。compose.dev.yaml の db-test と同じ接続先にする。
    services:
      db-test:
        image: postgres:18
        env:
          POSTGRES_USER: tadori
          POSTGRES_PASSWORD: tadori-test
          POSTGRES_DB: tadori_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U tadori -d tadori_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm biome ci .
      - run: pnpm test
      - run: pnpm build
      # E2E（ui.md 7章）。API はテスト用 DB を空にして起動するので、pnpm test の後に流す。
      - run: pnpm --filter @tadori/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
