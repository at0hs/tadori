name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # テスト用の DB（D-22）。compose.dev.yaml の db-test と同じ接続先にする。
    services:
      db-test:
        image: postgres:18
        env:
          POSTGRES_USER: tadori
          POSTGRES_PASSWORD: tadori-test
          POSTGRES_DB: tadori_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U tadori -d tadori_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm biome ci .
      - run: pnpm test
      - run: pnpm build
      # E2E（ui.md 7章）。API はテスト用 DB を空にして起動するので、pnpm test の後に流す。
      - run: pnpm --filter @tadori/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # 本番の構成（compose.yaml）を起動し、バックアップと復元の確認まで流す（operations.md）
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ダミーの .env を書く
        run: |
          cat > .env <<'ENV'
          APP_URL=http://localhost:3000
          POSTGRES_PASSWORD=ci0123456789abcdef
          BETTER_AUTH_SECRET=ci-secret-ci-secret-ci-secret-0123456789
          INITIAL_ADMIN_USERNAME=admin
          INITIAL_ADMIN_NAME=管理者
          INITIAL_ADMIN_EMAIL=admin@example.test
          INITIAL_ADMIN_PASSWORD=Initial-passw0rd-dummy
          ENV
      - run: docker compose up -d --build --wait
      - run: curl -fsS http://localhost:3000/api/health
      - name: 画面の URL を直接開くと index.html が返る
        run: curl -fsS http://localhost:3000/executions/x | grep -q 'id="root"'
      - name: バックアップのスクリプトのテスト
        run: docker compose run --rm -T backup bash /opt/tadori/test/lib.test.sh
      - run: docker compose exec -T backup tadori-backup
      - name: 復元の確認（初期管理者の1人が戻る）
        run: docker compose run --rm -T backup tadori-verify | tee verify.txt && grep -qx 'ユーザー：1' verify.txt
      - if: failure()
        run: docker compose logs
