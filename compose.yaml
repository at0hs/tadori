# 本番用の構成（operations.md 2章）。`.env` を書いて `docker compose up -d` で起動する。
# 開発用の DB は compose.dev.yaml（pnpm db:up）。
# HTTPS の前段（Caddy）は `--profile https` を付けたときだけ起動する（operations.md 9章）。
# `docker compose down -v` は DB のボリュームを消すので使わない（operations.md 11章）。

# ログの大きさと世代の上限（operations.md 10章）。ディスクを使い切らないようにする。
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # HTTPS のときは .env で APP_PORT=127.0.0.1:3000 にし、サーバーの外から直接届かないようにする
      - "${APP_PORT:-3000}:3000"
    networks:
      - default
      - proxy
    environment:
      APP_URL: ${APP_URL:?APP_URL を .env に書いてください}
      DATABASE_URL: postgres://tadori:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に書いてください}@db:5432/tadori
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET を .env に書いてください}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    logging: *logging

  db:
    # メジャーバージョンを固定する（D-53）。上げ方は operations.md 7章。
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: tadori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に書いてください}
      POSTGRES_DB: tadori
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tadori -d tadori"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  # 決まった時刻に pg_dump を取る（D-19、operations.md 5〜6章）。
  # その場で取る・復元の確認・復元のコマンドもこのイメージに入っている。
  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に書いてください}
      BACKUP_TIMES: ${BACKUP_TIMES:-03:00}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      # DB のボリュームとは別の、ホストのディレクトリに置く
      - ./backups:/backups
    logging: *logging

  # HTTPS の前段（operations.md 9章、D-68）。--profile https のときだけ起動する。
  # ここの変数に `:?` を使わない（profile で外していても compose が展開し、HTTP の起動まで止まる）。
  caddy:
    image: caddy:2.11
    profiles: [https]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_URL: ${APP_URL:-}
      CADDY_TLS: ${CADDY_TLS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 持ち込みの証明書の置き場（コミットしない）
      - ./certs:/certs:ro
      # 取った証明書と、internal のルート証明書。消すとルート証明書が変わり、全端末で入れ直しになる
      - caddy-data:/data
      - caddy-config:/config
    networks:
      proxy:
        # app の TRUSTED_PROXIES には、この IP だけを書く（範囲を書くとゲートウェイ経由の偽のヘッダを信じる）
        ipv4_address: ${CADDY_IP:-10.203.53.2}
    # 設定を読めたときだけ管理用の口が開く。CADDY_TLS の書き間違いなどで再起動を繰り返すと、up --wait が失敗する
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging: *logging

networks:
  # Caddy と app だけがつながるネットワーク。Caddy に決まった IP を割り当てるため、範囲を固定する。
  # 既定は Docker が自動で割り当てる範囲（172.17〜172.31、192.168）の外。
  # ip_range は app などに自動で割り当てる範囲。CADDY_IP と重ならないよう後ろ半分に限る（重なると app が先に取る）。
  # ぶつかるときは PROXY_SUBNET・PROXY_IP_RANGE・CADDY_IP の3つをそろえて変える。
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-10.203.53.0/24}
          ip_range: ${PROXY_IP_RANGE:-10.203.53.128/25}

volumes:
  db-data:
  caddy-data:
  caddy-config:
